name: datapilot

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datapilot}
      POSTGRES_USER: ${POSTGRES_USER:-datapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapilot-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-datapilot} -d ${POSTGRES_DB:-datapilot}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-datapilot-docker-local-development-key}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-datapilot}:${POSTGRES_PASSWORD:-datapilot-local-password}@database:5432/${POSTGRES_DB:-datapilot}
      SERVE_MEDIA: "True"
    volumes:
      - backend_runtime:/app/runtime
    depends_on:
      database:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 2
        --timeout 300
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_runtime:
